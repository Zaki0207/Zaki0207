    <circle class="point-b" cx="438" cy="82" r="1.7" />
    <circle class="point-a" cx="454" cy="51" r="2.5" />
    <circle class="point-b" cx="468" cy="35" r="1.5" />
    <circle class="point-a" cx="480" cy="72" r="1.8" />
    <circle class="point-a" cx="496" cy="58" r="2.6" />
    <circle class="point-b" cx="512" cy="87" r="1.5" />
    <circle class="point-a" cx="528" cy="46" r="2" />
    <circle class="point-b" cx="543" cy="67" r="2.7" />
    <circle class="point-a" cx="558" cy="28" r="1.5" />
    <circle class="point-a" cx="572" cy="78" r="2.1" />
    <circle class="point-b" cx="590" cy="53" r="1.8" />
    <circle class="point-a" cx="607" cy="91" r="2.5" />
    <circle class="point-b" cx="621" cy="39" r="1.5" />
    <circle class="point-a" cx="638" cy="63" r="2.1" />
    <circle class="point-a" cx="655" cy="76" r="1.6" />
    <circle class="point-b" cx="671" cy="48" r="2.4" />
    <circle class="point-a" cx="690" cy="69" r="1.7" />
    <circle class="point-b" cx="705" cy="57" r="1.4" />
  </g>

  <g fill="none" stroke-linecap="round" opacity="0.3">
    <path class="primary" d="M335 92C421 28 549 29 724 78" stroke-width="1.2" />
    <path class="secondary" d="M350 99C449 52 571 48 739 84" stroke-width="1" stroke-dasharray="4 7" />
  </g>
</svg>
