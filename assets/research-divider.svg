<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Research motif</title>
  <desc id="desc">Minimal line art showing camera geometry, a point cloud, and reconstructed three-dimensional objects.</desc>
  <style>
    .grid { stroke: #d0d7de; }
    .primary { stroke: #0969da; }
    .secondary { stroke: #8250df; }
    .point-a { fill: #0969da; }
    .point-b { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      .grid { stroke: #30363d; }
      .primary { stroke: #58a6ff; }
      .secondary { stroke: #a371f7; }
      .point-a { fill: #58a6ff; }
      .point-b { fill: #a371f7; }
    }
  </style>

  <g class="grid" fill="none" stroke-width="1" opacity="0.55">
    <path d="M0 30H1200M0 60H1200M0 90H1200" />
    <path d="M100 0V120M300 0V120M500 0V120M700 0V120M900 0V120M1100 0V120" />
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- calibrated multi-view cameras: optical centers, image planes, and viewing axes -->
    <g class="primary" stroke-width="1.45" opacity="0.78">
      <path d="M50 60L112 31L139 41L139 79L112 89Z" />
      <path d="M112 31L112 89M139 41L112 89" opacity="0.42" />
      <circle cx="50" cy="60" r="3.6" />
      <path d="M50 60L344 60" stroke-dasharray="3 7" opacity="0.38" />
    </g>

    <g class="secondary" stroke-width="1.3" opacity="0.66">
      <path d="M124 15L175 25L191 35L184 56L168 46Z" />
      <path d="M175 25L168 46M191 35L168 46" opacity="0.4" />
      <circle cx="124" cy="15" r="3.2" />
      <path d="M124 15L344 60" stroke-dasharray="3 7" opacity="0.42" />

      <path d="M124 105L168 74L184 64L191 85L175 95Z" />
      <path d="M168 74L175 95M184 64L175 95" opacity="0.4" />
      <circle cx="124" cy="105" r="3.2" />
      <path d="M124 105L344 60" stroke-dasharray="3 7" opacity="0.42" />
    </g>

    <g class="primary" stroke-width="1.2" opacity="0.55">
      <circle cx="344" cy="60" r="3" />
      <path d="M338 60H350M344 54V66" />
    </g>

    <g class="secondary" stroke-width="1.15" opacity="0.48">
      <path d="M744 88V59M744 88L773 99M744 88L762 68" />
      <circle cx="744" cy="88" r="2.2" />
    </g>

    <!-- wireframe cube -->
    <g class="primary" stroke-width="1.45" opacity="0.74">
      <path d="M790 43L853 53L853 96L790 85Z" />
      <path d="M813 25L876 35L876 78L813 68Z" />
      <path d="M790 43L813 25M853 53L876 35M853 96L876 78M790 85L813 68" />
      <path d="M790 43L876 78M813 25L853 96" opacity="0.28" stroke-dasharray="3 6" />
    </g>

    <!-- faceted reconstruction -->
    <g class="secondary" stroke-width="1.4" opacity="0.72">
      <path d="M973 21L1014 29L1041 58L1025 91L984 101L948 82L944 47Z" />
      <path d="M973 21L981 51L1014 29M981 51L1041 58M981 51L984 101M981 51L948 82M944 47L981 51" />
      <path d="M1014 29L1009 69L1041 58M1009 69L1025 91M1009 69L984 101M981 51L1009 69" />
      <circle cx="981" cy="51" r="2" />
      <circle cx="1009" cy="69" r="2" />
    </g>

    <!-- reconstructed cylinder -->
    <g class="primary" stroke-width="1.35" opacity="0.68">
      <ellipse cx="1132" cy="34" rx="42" ry="13" />
      <path d="M1090 34V83M1174 34V83" />
      <path d="M1090 83C1090 90 1109 96 1132 96C1155 96 1174 90 1174 83" />
      <path d="M1090 83C1090 76 1109 70 1132 70C1155 70 1174 76 1174 83" opacity="0.34" stroke-dasharray="3 5" />
      <path d="M1132 21V96M1090 34L1174 83M1174 34L1090 83" opacity="0.23" stroke-dasharray="3 6" />
    </g>
  </g>

  <g opacity="0.88">
    <circle class="point-a" cx="355" cy="68" r="2.1" />
    <circle class="point-a" cx="374" cy="55" r="1.7" />
    <circle class="point-b" cx="390" cy="75" r="2.4" />
    <circle class="point-a" cx="406" cy="43" r="1.5" />
    <circle class="point-a" cx="421" cy="64" r="2.2" />
    <circle class="point-b" cx="438" cy="82" r="1.7" />
    <circle class="point-a" cx="454" cy="51" r="2.5" />
    <circle class="point-b" cx="468" cy="35" r="1.5" />
    <circle class="point-a" cx="480" cy="72" r="1.8" />
    <circle class="point-a" cx="496" cy="58" r="2.6" />
    <circle class="point-b" cx="512" cy="87" r="1.5" />
    <circle class="point-a" cx="528" cy="46" r="2" />
    <circle class="point-b" cx="543" cy="67" r="2.7" />
    <circle class="point-a" cx="558" cy="28" r="1.5" />
    <circle class="point-a" cx="572" cy="78" r="2.1" />
    <circle class="point-b" cx="590" cy="53" r="1.8" />
    <circle class="point-a" cx="607" cy="91" r="2.5" />
    <circle class="point-b" cx="621" cy="39" r="1.5" />
    <circle class="point-a" cx="638" cy="63" r="2.1" />
    <circle class="point-a" cx="655" cy="76" r="1.6" />
    <circle class="point-b" cx="671" cy="48" r="2.4" />
    <circle class="point-a" cx="690" cy="69" r="1.7" />
    <circle class="point-b" cx="705" cy="57" r="1.4" />
  </g>

  <g fill="none" stroke-linecap="round" opacity="0.3">
    <path class="primary" d="M335 92C421 28 549 29 724 78" stroke-width="1.2" />
    <path class="secondary" d="M350 99C449 52 571 48 739 84" stroke-width="1" stroke-dasharray="4 7" />
  </g>
</svg>
